manifestVersion: 1
id: longstreet-litecoin
category: bitcoin
name: Litecoin Node
version: "1.2.3"
tagline: Run your own Litecoin Core full node
description: >-
  Litecoin Core full node with RPC and ZMQ block notifications exposed to other
  apps on this Umbrel (for example a merged-mining Stratum server). Wallet is
  disabled; this node is for validation and block-template generation.
releaseNotes: >-
  Litecoin Core 0.21.5.8. The best block hash on the status page now links to litecoinspace.org so you can confirm your node is on the same chain as the network. The node also records its start time for the status page.
