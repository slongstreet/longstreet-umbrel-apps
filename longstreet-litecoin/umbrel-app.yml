manifestVersion: 1
id: longstreet-litecoin
category: bitcoin
name: Litecoin Node
version: "1.2.4"
tagline: Run your own Litecoin Core full node
description: >-
  Litecoin Core full node with RPC and ZMQ block notifications exposed to other
  apps on this Umbrel (for example a merged-mining Stratum server). Wallet is
  disabled; this node is for validation and block-template generation.
releaseNotes: >-
  Litecoin Core 0.21.5.8. Fixes app updates: umbrelOS only refreshes a few files on update, so earlier releases kept running the originally installed node script and status page. The app now syncs them on every start. This release therefore delivers the automatic dbcache tuning, node uptime and the best block hash link to litecoinspace.org that earlier updates announced.
developer: Longstreet Labs
website: https://github.com/slongstreet/longstreet-umbrel-apps
