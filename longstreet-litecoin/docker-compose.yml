version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: longstreet-litecoin_status_1
      APP_PORT: 8080

  litecoind:
    image: ghcr.io/slongstreet/litecoind:0.21.5.8@sha256:70cbaa561d8aa0adb90e856332532928c78856ab5e976791fe29de8190c225d1
    restart: on-failure
    stop_grace_period: 15m          # litecoind flushes dbcache on shutdown; do not cut it short
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/litecoin:/data/.litecoin
      - ${APP_DATA_DIR}/litecoin.conf:/etc/litecoin/litecoin.conf:ro
      - ${APP_DATA_DIR}/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "${APP_LONGSTREET_LITECOIN_P2P_PORT}:${APP_LONGSTREET_LITECOIN_P2P_PORT}"   # inbound peers (optional)
    environment:
      DAEMON: litecoind
      MALLOC_ARENA_MAX: "1"     # curb glibc heap fragmentation across Core's threads
      DATADIR: /data/.litecoin
      RPC_USER: ${APP_LONGSTREET_LITECOIN_RPC_USER}
      RPC_PASS: ${APP_LONGSTREET_LITECOIN_RPC_PASS}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      - -rpcport=${APP_LONGSTREET_LITECOIN_RPC_PORT}
      - -port=${APP_LONGSTREET_LITECOIN_P2P_PORT}
      - -zmqpubhashblock=tcp://0.0.0.0:${APP_LONGSTREET_LITECOIN_ZMQ_HASHBLOCK_PORT}
      - -zmqpubrawblock=tcp://0.0.0.0:${APP_LONGSTREET_LITECOIN_ZMQ_RAWBLOCK_PORT}
    networks:
      default:
        ipv4_address: ${APP_LONGSTREET_LITECOIN_NODE_IP}

  status:
    image: python:3.12-alpine
    restart: on-failure
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/status:/app:ro
      - ${APP_DATA_DIR}/data/litecoin:/node:ro
    environment:
      COIN_NAME: Litecoin
      NODE_START_FILE: /node/.started
      RPC_URL: http://${APP_LONGSTREET_LITECOIN_NODE_IP}:${APP_LONGSTREET_LITECOIN_RPC_PORT}
      RPC_USER: ${APP_LONGSTREET_LITECOIN_RPC_USER}
      RPC_PASS: ${APP_LONGSTREET_LITECOIN_RPC_PASS}
    command: python /app/app.py
    networks:
      default:
        ipv4_address: ${APP_LONGSTREET_LITECOIN_STATUS_IP}
