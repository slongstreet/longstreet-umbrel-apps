# Litecoin Core — validation + block-template node (no wallet)
# Credentials, ports and ZMQ endpoints come from docker-compose.
# This file is overwritten on every app update. To override anything here,
# put it in data/litecoin/litecoin.local.conf instead (see README).

server=1
disablewallet=1
txindex=0
listen=1

# RPC only from the Umbrel app network
rpcbind=0.0.0.0
rpcallowip=10.21.0.0/16

# Initial block download tuning — lower dbcache to ~450 after sync
dbcache=1536
par=4
maxconnections=40

# Uncomment to cap disk usage (MiB). Pruned nodes can still serve getblocktemplate.
# prune=20000

# Keep a small mempool; this node only needs enough tx to build templates
maxmempool=300
