manifestVersion: 1
id: longstreet-dogecoin
category: bitcoin
name: Dogecoin Node
version: "1.2.3"
tagline: Run your own Dogecoin Core full node
description: >-
  Dogecoin Core full node with RPC and ZMQ block notifications exposed to other
  apps on this Umbrel. Provides createauxblock / submitauxblock for AuxPoW
  merged mining alongside the Litecoin Node app. Wallet is disabled.
releaseNotes: >-
  Dogecoin Core 1.14.9. Fixes app updates: umbrelOS only refreshes a few files on update, so earlier releases kept running the originally installed node script and status page. The app now syncs them on every start. This release therefore delivers the automatic dbcache tuning, node uptime and the best block hash link to dogechain.info that earlier updates announced.
developer: Longstreet Labs
website: https://github.com/slongstreet/longstreet-umbrel-apps
