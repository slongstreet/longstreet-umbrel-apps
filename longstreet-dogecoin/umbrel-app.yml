manifestVersion: 1
id: longstreet-dogecoin
category: bitcoin
name: Dogecoin Node
version: "1.2.0"
tagline: Run your own Dogecoin Core full node
description: >-
  Dogecoin Core full node with RPC and ZMQ block notifications exposed to other
  apps on this Umbrel. Provides createauxblock / submitauxblock for AuxPoW
  merged mining alongside the Litecoin Node app. Wallet is disabled.
releaseNotes: >-
  Dogecoin Core 1.14.9. dbcache is now managed automatically: 1536 MiB during the initial
  sync, then the node restarts itself once with 450 MiB to give RAM back to the
  box. Set dbcache in <coin>.local.conf to take manual control.
developer: Longstreet Labs
website: https://github.com/slongstreet/longstreet-umbrel-apps
