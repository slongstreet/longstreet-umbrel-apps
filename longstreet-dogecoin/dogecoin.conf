# Dogecoin Core 1.14.x — validation + AuxPoW aux-block node (no wallet)
# Credentials, ports and ZMQ endpoints come from docker-compose.
# This file is overwritten on every app update. To override anything here,
# put it in data/dogecoin/dogecoin.local.conf instead (see README).

server=1
disablewallet=1
txindex=0
listen=1

rpcbind=0.0.0.0
rpcallowip=10.21.0.0/16

# dbcache is set by entrypoint.sh: 1536 during initial sync, 450 once synced.
# Override in dogecoin.local.conf to disable that.
par=4
# 8 outbound peers are always kept; only inbound slots shrink. Fewer peers = less memory.
maxconnections=24

# Uncomment to cap disk usage (MiB). createauxblock works on a pruned node.
# prune=20000

# Unused mempool allowance is lent to the UTXO cache, so this also bounds dbcache overshoot.
# Only the lowest-fee tail is evicted; block templates draw from the top of the fee ordering.
maxmempool=100
