# Dogecoin Core 1.14.x — validation + AuxPoW aux-block node (no wallet)
# Credentials, ports and ZMQ endpoints come from docker-compose.
# This file is overwritten on every app update. To override anything here,
# put it in data/dogecoin/dogecoin.local.conf instead (see README).

server=1
disablewallet=1
txindex=0
listen=1

rpcbind=0.0.0.0
rpcallowip=10.21.0.0/16

# IBD tuning — 1.14 is single-threaded in places; dbcache matters more than par here
dbcache=1536
par=4
maxconnections=40

# Uncomment to cap disk usage (MiB). createauxblock works on a pruned node.
# prune=20000

maxmempool=300
